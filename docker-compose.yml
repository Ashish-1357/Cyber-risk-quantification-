version: '3.8'

services:
  cyber-risk-server:
    build: ./server
    container_name: cyber-risk-server
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=Cyber Risk Quantification Platform
      - APP_VERSION=1.0.0
      - DEBUG=false
      - ENVIRONMENT=production
      - HOST=0.0.0.0
      - PORT=8000
      - WORKERS=4
      - DEFAULT_SIMULATIONS=50000
      - DEFAULT_BUDGET=3000000
      - DEFAULT_STAFF_CAPACITY=50
      - DEFAULT_RISK_APPETITE=5000000
      - CORS_ORIGINS=*
      - LOG_LEVEL=INFO
    volumes:
      - ./server/.env:/app/.env:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Optional: Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: cyber-risk-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./client:/usr/share/nginx/html:ro
    depends_on:
      - cyber-risk-server
    restart: unless-stopped
    profiles:
      - production
